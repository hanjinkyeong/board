spring:
  messages:
    basename: messages, errors
    encoding: UTF-8

  datasource:
    url: jdbc:mysql://localhost:3306/boarddb
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 서버 실행 시 데이터베이스 테이블 생성 전략(create, create-drop, update[변경 사항], validate)
      # 프로젝트 만들때나 협업 및 운영 : (update, validate)를 사용하는것이 최적
      ddl-auto: update
    # Hibernate가 실행하는 SQL을 콘솔에 출력
    show-sql: true
    properties:
      hibernate:
        # SQL을 보기 편하게 줄바꿈
        format_sql: true


server:
  servlet:
    session:
      tracking-modes: cookie
#  error:
#    whitelabel:
#      enabled: false

# 첨부파일 저장 경로
file:
  upload-path: ./upload






