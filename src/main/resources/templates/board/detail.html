<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${board.title}">글 상세</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
  <div class="card">
    <h1 th:text="${board.title}">제목</h1>
    <div class="post-meta">
      작성자 <b th:text="${board.member.loginId}">작성자</b>
      · 조회 <span th:text="${board.viewCount}">0</span>
      · <span th:text="${#temporals.format(board.createdAt,'yyyy-MM-dd HH:mm')}">날짜</span>
    </div>

    <div class="original-label">내용</div>
    <div class="post-content" th:text="${board.content}">내용</div>

    <!-- 첨부파일이 있으면 -->
    <div class="attachment" th:if="${board.hasAttachment}">
      첨부파일:
      <a th:href="@{/boards/{id}/download(id=${board.id})}" th:text="${board.originalFileName}"></a>
    </div>

    <div class="button-row">
      <a th:href="@{/boards}" class="btn gray">목록</a>
      <a th:href="@{/boards/{id}/edit(id=${board.id})}" class="btn">수정</a>
      <form th:action="@{/boards/{id}/delete(id=${board.id})}" method="post"
            style="display:inline" onsubmit="return confirm('정말 삭제하시겠습니까?');">
        <button type="submit" class="btn danger">삭제</button>
      </form>
    </div>
  </div>

  <!-- 댓글 기능 -->
  <div class="comment-section">
    <h2>댓글</h2>
    <div id="comment-list">
      <div class="loading-text">댓글을 불러오는 중...</div>
    </div>

    <form class="comment-form"
          id="comment-form"
          th:if="${session.loginMember != null}">
      <textarea name="content" placeholder="댓글을 입력하세요"></textarea>
      <button type="submit" class="btn">등록</button>
    </form>
    <p th:unless="${session.loginMember != null}">
      댓글을 작성하려면 로그인이 필요합니다.
    </p>
  </div>
</div>

<script th:inline="javascript">
  const BOARD_ID = /*[[${board.id}]]*/ 0;
  const commentForm = document.getElementById('comment-form');
  const commentList = document.getElementById('comment-list');

  // 페이지가 로드되면 댓글 목록을 불러온다.
  document.addEventListener('DOMContentLoaded', ()=>{
    loadComment();
  });

   // 댓글 목록을 불러오는 함수
    async function loadComment() {
        try {
            // GET 요청으로 해당 게시글의 댓글 목록을 조회
            const response = await fetch(`/boards/${BOARD_ID}/comments`);
            const comments = await response.json();
            // console.log(comments);

            // 댓글 목록 HTML 생성
            commentList.innerHTML = comments.map(comment =>
                `<div class="comment-item">
                    <span class="writer">${comment.writerName}(${comment.writerLoginId})</span>
                    <span class="text">${comment.content}</span>
                    <span class="date">${comment.createdAt}</span>
                    ${comment.mine ? `<button type="button" class="btn small danger" onclick="deleteComment(${comment.id})">삭제</button>` : ''}
                 </div>`
            ).join('');

        } catch (error) {
            console.log(error);
        }
    }

   // 댓글 삭제 함수
    async function deleteComment(commentId) {
        if (!confirm('이 댓글을 삭제하시겠습니까?')) {
            return;
        }
        // console.log(commentId + '삭제');
        try {
            const response = await fetch(`/boards/${BOARD_ID}/comments/${commentId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                alert('댓글이 삭제되었습니다.');
                await loadComment();
            }
        } catch (error) {
            console.log(error);
        }
    }


  if (commentForm) {
      // 댓글 등록 버튼 클리 시 이벤트를 가로챈다.
      // async: 이 함수 안에서 비동기 작업을 기다리겠다는 선언
      commentForm.addEventListener('submit', async (e) => {
          e.preventDefault(); // 이벤트의 전파를 차단한다.

          const textarea = commentForm.querySelector('textarea');
          const content = textarea.value;

          try {
              // await: fetch 작업이 끝날 때 까지 실행을 멈추고 대기한다.
              const response = await fetch(`/boards/${BOARD_ID}/comments`, {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify({content: content})
              });

              // 응답 데이터를 JSON으로 변환할 때 까지 기다린다.
              const data = await response.json();
              console.log(data);
              alert('댓글이 등록되었습니다.');
              textarea.value = '';
              await loadComment();
          } catch (error) {
              console.log('등록 실패', error);
          }
      });
  }

</script>
</body>
</html>
