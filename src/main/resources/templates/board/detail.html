<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>게시글 상세보기</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">

  <div class="card">

    <h1 th:text="${board.title}">제목</h1>

    <div class="post-meta">
      작성자 <span th:text="${board.writer}"></span>
      · 조회 <span th:text="${board.viewCount}"></span>
      · <span th:text="${board.createdAt}"></span>
    </div>

    <div class="original-label">
      내용
    </div>

    <div class="post-content"
         th:text="${board.content}">
      내용
    </div>

    <div class="button-row">

      <a th:href="@{/boards}"
         class="btn gray">목록</a>

      <a th:href="@{/boards/{id}/edit(id=${board.id})}"
         class="btn">수정</a>

      <form th:action="@{/boards/{id}/delete(id=${board.id})}"
            method="post"
            style="display:inline;">
        <button type="submit"
                class="btn danger">
          삭제
        </button>
      </form>

    </div>

  </div>

</div>

</body>
</html>
