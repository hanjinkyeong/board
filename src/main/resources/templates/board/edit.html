<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>글 수정</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
  <a class="brand" th:href="@{/boards}">게시판</a>
  <div class="menu"><a th:href="@{/boards}">목록</a></div>
</header>

<div class="container">
  <h1>글 수정</h1>
  <div class="card">
    <form th:action="@{/boards/{id}/edit(id=${board.id})}"
          th:object="${board}"
          method="post">
      <div class="form-group">
        <label for="title">제목</label>
        <input type="text" th:field="*{title}">
      </div>
      <div class="form-group">
        <label for="content">내용</label>
        <textarea th:field="*{content}"></textarea>
      </div>
      <button type="submit" class="btn">수정</button>
      <a th:href="@{/boards/{id}(id=${boardId})}" class="btn gray">취소</a>
    </form>
  </div>
</div>
</body>
</html>
