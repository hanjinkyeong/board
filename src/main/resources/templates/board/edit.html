<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>글 수정</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!--<header class="topbar">-->
<!--  <a class="brand" th:href="@{/boards}">게시판</a>-->
<!--  <div class="menu"><a th:href="@{/boards}">목록</a></div>-->
<!--</header>-->
<div th:replace="~{fragments/header :: header}"></div>
<div class="container">
  <h1>글 수정</h1>
  <div class="card">
    <form th:action="@{/boards/{id}/edit(id=${board.id})}"
          th:object="${board}"
          method="post" enctype="multipart/form-data">
      <div class="form-group">
        <label for="title">제목</label>
        <input type="text" th:field="*{title}">
      </div>
      <div class="form-group">
        <label for="content">내용</label>
        <textarea th:field="*{content}"></textarea>
      </div>
      <div class="form-group" th:if="*{hasAttachment}">
        <label>현재 첨부파일</label><br>
        <span th:text="*{originalFileName}"></span><br>
        <div style="display:flex; align-items:center; gap:8px; margin-top:10px;">
          <input type="checkbox"
                 id="deleteFile"
                 name="deleteFile"
                 value="true"
                 style="width:auto; margin:0;">

          <label for="deleteFile"
                 style="display:inline; margin:0; font-weight:600;">
            기존 파일 삭제
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>새 첨부파일</label>
        <input type="file" name="file">
      </div>
      <button type="submit" class="btn">수정</button>
      <a th:href="@{/boards/{id}(id=${board.id})}" class="btn gray">취소</a>
    </form>
  </div>
</div>
</body>
</html>
