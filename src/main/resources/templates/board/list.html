<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시판</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
    <div class="menu">
        <!-- 로그인을 한 경우 -->
        <span th:if="${session.loginMember != null}">
            <b th:text="${session.loginMember.name}">사용자</b>님
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn gray">로그아웃</button>
            </form>
        </span>
        <!-- 로그인을 하지 않은 경우 -->
        <span th:if="${session.loginMember == null}">
            <a th:href="@{/login}">로그인</a>
            <a th:href="@{/join}">회원가입</a>
        </span>
    </div>
</header>

<div class="container">
    <h1>게시글 목록</h1>

    <div class="toolbar">
        <span></span>
        <a th:if="${session.loginMember != null}"
           th:href="@{/boards/write}" class="btn">글쓰기</a>
    </div>

    <table class="board-list">
        <thead>
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성자</th>
            <th>조회</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="board : ${boards}">
            <td th:text="${boardStat.count}">1</td>
            <td><a th:href="@{/boards/{id}(id=${board.id})}">[[${board.title}]]</a></td>
            <td th:text="${board.writer}">작성자</td>
            <td>[[${board.viewCount}]]</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
