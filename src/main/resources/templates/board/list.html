<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">s
<head>
    <meta charset="UTF-8">
    <title>list</title>
    <link rel = "stylesheet" href="/css/style.css">
</head>
<body>
  <div class = "container">
    <h1>게시글 목록</h1>
      <div class="toolbar">
          <span></span>
          <a th:href="@{/boards/write}" class="btn">글쓰기</a>
      </div>
      <table class = "board-list">
          <thead>
          <tr>
              <th>번호</th>
              <th>제목</th>
              <th>작성자</th>
              <th>조회수</th>
          </tr>
          </thead>
          <tbody>
            <tr th:each="board : ${boards}">
                <td th:text="${board.id}">1</td>
                <td><a th:href="@{/boards/{id}(id=${board.id})}"
                       th:text="${board.title}">제목</a></td>
                <td th:text="${board.writer}">작성자</td>
                <td th:text="${board.viewCount}">10</td>

            </tr>
          </tbody>
      </table>
  </div>
</body>
</html>
